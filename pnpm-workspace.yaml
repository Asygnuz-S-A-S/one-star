allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
# Versiones parcheadas de dependencias transitivas cuyo paquete padre todavía
# no las publica. Ver docs/seguridad-dependencias.md para el porqué de cada una.
overrides:
  'axios': '^1.20.0'
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@5': '^5.0.12'
  'browserslist': '^4.28.7'
  'deepmerge-ts': '^8.0.0'
  'dompurify': '^3.4.16'
  'effect': '^3.22.1'
  'fast-uri@3': '^3.1.8'
  'follow-redirects': '^1.16.2'
  'js-yaml@4': '^4.3.1'
  'nanoid@3': '^3.3.18'
  # picomatch 4.x no tiene versión corregida para GHSA-fc5q-39xc-vjpf: todas las
  # copias van en 4.0.7, que lleva el parche local de patches/ (ver
  # docs/seguridad-dependencias.md, «Excepciones sin parche»).
  'picomatch@4': '4.0.7'
  'postcss@8': '^8.5.28'
  'qs@6': '^6.16.0'
  'sharp': '^0.35.5'
  'source-map-js': '^1.2.2'
  'vite': '^8.1.6'
  'vitest': '^4.1.12'
patchedDependencies:
  picomatch@4.0.7: patches/picomatch@4.0.7.patch

# Corregido por patches/picomatch@4.0.7.patch (ver docs/seguridad-dependencias.md). Quitar con picomatch >= 4.0.8.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
