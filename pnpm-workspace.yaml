  'brace-expansion@5': '^5.0.12'
  'browserslist': '^4.28.7'
  'deepmerge-ts': '^8.0.0'
  'dompurify': '^3.4.16'
  'fast-uri@3': '^3.1.8'
  'js-yaml@4': '^4.3.1'
  'nanoid@3': '^3.3.18'
  'postcss@8': '^8.5.28'
  'qs@6': '^6.16.0'
  'sharp': '^0.35.5'
  'axios': '^1.20.0'
  'follow-redirects': '^1.16.1'
  'source-map-js': '^1.2.2'
  'vite': '^8.1.6'
  'vitest': '^4.1.12'
