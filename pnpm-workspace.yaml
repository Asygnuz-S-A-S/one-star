allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Versiones parcheadas de dependencias transitivas cuyo paquete padre todavía
# no las publica. Ver docs/seguridad-dependencias.md para el porqué de cada una.
overrides:
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@5': '^5.0.9'
  'browserslist': '^4.28.7'
  'deepmerge-ts': '^8.0.0'
  'fast-uri@3': '^3.1.6'
  'js-yaml@4': '^4.3.1'
  'nanoid@3': '^3.3.18'
  'postcss@8': '^8.5.28'
  'sharp': '^0.35.4'
  'dompurify': '^3.4.13'
  'qs@6': '^6.16.0'
