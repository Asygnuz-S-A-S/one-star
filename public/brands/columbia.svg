<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" fill="#1C1C1C">
  <!-- Columbia Iconic 8-rectangle textile weave emblem -->
  <g transform="translate(10, 15)">
    <!-- Top-left pair (horizontal) -->
    <rect x="0" y="2" width="16" height="6.5" rx="3.25" />
    <rect x="0" y="11" width="16" height="6.5" rx="3.25" />
    <!-- Bottom-right pair (horizontal) -->
    <rect x="22" y="22" width="16" height="6.5" rx="3.25" />
    <rect x="22" y="31" width="16" height="6.5" rx="3.25" />
    <!-- Top-right pair (vertical) -->
    <rect x="22" y="0" width="6.5" height="16" rx="3.25" />
    <rect x="31" y="0" width="6.5" height="16" rx="3.25" />
    <!-- Bottom-left pair (vertical) -->
    <rect x="0" y="22" width="6.5" height="16" rx="3.25" />
    <rect x="9" y="22" width="6.5" height="16" rx="3.25" />
  </g>
  <!-- Columbia Typography -->
  <text x="60" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="29" letter-spacing="1">Columbia</text>
</svg>
