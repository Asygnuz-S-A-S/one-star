services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onestar
      POSTGRES_PASSWORD: onestar_pass
      POSTGRES_DB: onestar
    volumes:
      - onestar_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onestar -d onestar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Migraciones + Seed ───────────────────────────────────────────────────────
  # Usa el stage "builder" que tiene el CLI de Prisma (devDep) y tsx para el seed.
  # Se ejecuta UNA sola vez y termina. El servicio "app" espera su éxito.
  migrate:
    build:
      context: .
      target: builder
      args:
        AUTH_SECRET: ${AUTH_SECRET}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: "postgresql://onestar:onestar_pass@db:5432/onestar?schema=public"
    depends_on:
      db:
        condition: service_healthy

  # ── Aplicación Next.js ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runner
      args:
        AUTH_SECRET: ${AUTH_SECRET}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://onestar:onestar_pass@db:5432/onestar?schema=public"
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ── Adminer (inspector visual de BD) ────────────────────────────────────────
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  onestar_pgdata:
